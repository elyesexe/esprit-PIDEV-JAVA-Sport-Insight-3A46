# Configuration Sport Insight
# Paramètres de connexion à la base de données

# Hôte MySQL
mysql.host=localhost

# Port MySQL
mysql.port=3306

# Nom de la base de données
mysql.database=sport_insight

# Nom d'utilisateur
mysql.user=root

# Mot de passe (laisser vide si pas de mot de passe)
mysql.password=

# Pool de connexion
connection.pool.size=10
connection.timeout=30000

# Paramètres d'application
app.name=Sport Insight
app.version=1.0.0
app.locale=fr_FR

# Logging
log.level=INFO
log.file=logs/application.log

